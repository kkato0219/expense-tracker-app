<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BudgetFlow</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- ========== HEADER ========== -->
    <header>
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">💰</span>
                <span>BudgetFlow</span>
            </div>
            <div class="header-right">
                <select id="month-filter">
                    <option value="all">All Months</option>
                    <option value="1">January</option>
                    <option value="2">February</option>
                    <option value="3">March</option>
                    <option value="4">April</option>
                    <option value="5">May</option>
                    <option value="6">June</option>
                    <option value="7">July</option>
                    <option value="8">August</option>
                    <option value="9">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                </select>
                <button id="clear-all" class="clear-btn">Clear All</button>
            </div>
        </div>
    </header>

    <div class="container">

        <!-- ========== SUMMARY CARDS ========== -->
        <section class="summary">
            <div class="summary-card balance-card">
                <p class="card-label">Total Balance</p>
                <p class="card-amount" id="balance">¥0</p>
                <p class="card-sub">Updated just now</p>
            </div>
            <div class="summary-card income-card">
                <p class="card-label">💚 Total Income</p>
                <p class="card-amount income" id="income">¥0</p>
            </div>
            <div class="summary-card expense-card">
                <p class="card-label">❤️ Total Expense</p>
                <p class="card-amount expense" id="expense">¥0</p>
            </div>
        </section>

        <!-- ========== BUDGET PROGRESS ========== -->
        <section class="budget-section">
            <div class="budget-header">
                <p class="section-title">Monthly Budget</p>
                <div class="budget-input-row">
                    <input type="number" id="budget-input" placeholder="Set budget...">
                    <button id="set-budget">Set</button>
                </div>
            </div>
            <div class="progress-bar-wrap">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <p class="budget-status" id="budget-status">No budget set</p>
        </section>

        <div class="main-grid">

            <!-- ========== ADD TRANSACTION ========== -->
             <section class="add-section">
                <p class="section-title">Add Transaction</p>

                <!-- Type toggle -->
                <div class="type-toggle">
                    <button class="type-btn active" data-type="income" id="income-btn">
                        + Income
                    </button>
                    <button class="type-btn" data-type="expense" id="expense-btn">
                        − Expense
                    </button>
                </div>

                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="title" placeholder="e.g. Salary, Lunch...">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Amount (¥)</label>
                        <input type="number" id="amount" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="date">
                    </div>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select id="category">
                        <option value="food">🍔 Food & Drink</option>
                        <option value="transport">🚃 Transport</option>
                        <option value="shopping">🛍️ Shopping</option>
                        <option value="bills">💡 Bills</option>
                        <option value="health">💊 Health</option>
                        <option value="salary">💼 Salary</option>
                        <option value="other">📦 Other</option>
                    </select>
                </div>

                <button id="add-btn" class="add-btn">Add Transaction</button>
             </section>

             <!-- ========== CHART ========== -->
              <section class="chart-section">
                <p class="section-title">Spending Overview</p>
                <div class="chart-wrap">
                    <canvas id="myChart"></canvas>
                    <p id="chart-empty" class="empty-msg">No data yet</p>
                </div>
              </section>

        </div>

        <!-- ========== TRANSACTIONS ========== -->
        <section class="transactions-section">
            <div class="transactions-header">
                <p class="section-title">Transactions</p>
                <input type="text" id="search" placeholder="🔍 Search...">
            </div>

            <!-- Category filter -->
            <div class="filter-row">
                <button class="filter-btn active" data-category="all">All</button>
                <button class="filter-btn" data-category="food">🍔 Food</button>
                <button class="filter-btn" data-category="transport">🚃 Transport</button>
                <button class="filter-btn" data-category="shopping">🛍️ Shopping</button>
                <button class="filter-btn" data-category="bills">💡 Bills</button>
                <button class="filter-btn" data-category="health">💊 Health</button>
                <button class="filter-btn" data-category="salary">💼 Salary</button>
                <button class="filter-btn" data-category="other">📦 Other</button>
            </div>

            <ul id="list"></ul>
            <p id="list-empty" class="empty-msg" style="display:none;">No transactions found</p>
        </section>

    </div>

    <!-- ========== EDIT MODAL ========== -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <h3>Edit Transaction</h3>
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="edit-title">
            </div>
            <div class="form-group">
                <label>Amount (¥)</label>
                <input type="number" id="edit-amount">
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="edit-category">
                    <option value="food">🍔 Food & Drink</option>
                    <option value="transport">🚃 Transport</option>
                    <option value="shopping">🛍️ Shopping</option>
                    <option value="bills">💡 Bills</option>
                    <option value="health">💊 Health</option>
                    <option value="salary">💼 Salary</option>
                    <option value="other">📦 Other</option>
                </select>
            </div>
            <div class="modal-actions">
                <button id="save-edit" class="add-btn">Save</button>
                <button id="cancel-edit" class="clear-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
